<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volviendo a Morocho…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1014; color: #ECE8E1;
           font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #58C4DD; }
  </style>
</head>
<body>
  <p id="msg">Volviendo a Morocho…</p>
  <script>
    // Relay OAuth: YouTube / Instagram / TikTok exigen redirect https, Morocho vive en http
    // dentro de tu red. Esta página (publicada en un hosting https, ej. GitHub Pages) reenvía
    // el ?code=…&state=… a tu instancia local. No guarda ni manda nada a ningún otro lado.
    var TARGET = "http://morocho.tv";      // a dónde vuelve el navegador
    var PREFIX = "";                        // sitio de usuario (inakisarobe.github.io): sin carpeta
    var path = location.pathname.indexOf(PREFIX) === 0 ? location.pathname.slice(PREFIX.length) : location.pathname;
    if (path.indexOf("/api/oauth/") === 0) {
      var url = TARGET + path + location.search + location.hash;
      document.getElementById("msg").innerHTML = 'Volviendo a <a href="' + url.replace(/"/g, "") + '">Morocho</a>…';
      location.replace(url);
    } else {
      document.getElementById("msg").textContent = "Relay OAuth de Morocho.";
    }
  </script>
</body>
</html>
